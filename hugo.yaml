baseURL: https://rxwang-phys.github.io/
locale: zh-CN
defaultContentLanguage: zh
title: My Blog 
theme: PaperMod 

params:
  env: production
  defaultTheme: auto
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  profileMode:
    enabled: true
    title: "Your Name"
    subtitle: "A short description about you or your blog"
    imageUrl: "/images/IMG1.jpg"
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: Posts
        url: "/posts/"
      - name: Archive
        url: "/archives/"
      # - name: Github
        # url: "https://github.com/"
  # socialIcons: # optional
    # - name: "Github"
      # url: "https://github.com/"
  # ShowShareButtons: true
  # ShowBreadCrumbs: true
  # ShowPostNavLinks: true
  mainSections:
    - posts
    - notes

menu:
  main:
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 10
    - identifier: search
      name: Search
      url: /search/
      weight: 20
    - identifier: notes
      name: 胡思乱想
      url: /notes/
      weight: 30

outputs:
  home:
    - HTML
    - RSS
    - JSON

