baseURL: https://rxwang-phys.github.io/
locale: zh-CN
defaultContentLanguage: zh
title: My Blog 
theme: PaperMod 

params:
  env: production
  defaultTheme: auto
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  profileMode:
    enabled: true
    title: "Your Name"
    subtitle: "千里之行 始于足下"
    imageUrl: "/images/IMG1.jpg"
    imageWidth: 120
    imageHeight: 120
    # buttons:
    #   - name: Posts
    #     url: "/posts/"
    #   - name: Archives
    #     url: "/archives/"
      # - name: Github
        # url: "https://github.com/"
  # socialIcons: # optional
    # - name: "Github"
      # url: "https://github.com/"
  # ShowShareButtons: true
  # ShowBreadCrumbs: true
  # ShowPostNavLinks: true
  mainSections:
    - posts
    # - notes
    - reading

menu:
  main:
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 10
    - identifier: search
      name: Search
      url: /search/
      weight: 20
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 30
    - identifier: notes
      name: 胡思乱想
      url: /notes/
      weight: 40
    - identifier: reading
      name: 闲书随笔
      url: /reading/
      weight: 50

outputs:
